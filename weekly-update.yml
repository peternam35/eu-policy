name: Weekly EU Policy Data Check

on:
  schedule:
    # 22:00 UTC Sunday = 07:00 KST Monday
    - cron: '0 22 * * 0'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run weekly check
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/weekly_update.py

      - name: Check for file changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "주간 자동 점검: EU 법안 데이터 업데이트"
          branch: weekly-update-${{ github.run_number }}
          title: "주간 데이터 점검 — ${{ github.run_id }}"
          body-path: weekly_changelog.md
          add-paths: |
            index.html
            mobile.html
            weekly_changelog.md
